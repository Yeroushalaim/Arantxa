<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arantxa</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2">
<link rel="shortcut icon" href="favicon.ico?v=2">
<style>
  :root {
    --bg: #eceff1;
    --ink: #2e1a12;
    --accent: #d9481c;
    --panel: #1c1512;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1613; --ink: #f2e9e4; --accent: #ff7a4d; --panel: #0f0b09; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: flex-end;
    padding: .75rem clamp(.75rem, 2vw, 1.5rem) .5rem;
  }
  .contact { display: block; }
  .contact img { width: 32px; height: auto; display: block; transition: transform .2s ease; }
  .contact:hover img { transform: scale(1.06); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  main { padding: 0 clamp(.75rem, 2vw, 1.5rem) 1.5rem; }
  .slideshow { max-width: 120rem; margin: 0 auto; }
  .stage {
    position: relative;
    aspect-ratio: 16 / 9;
    max-height: calc(100vh - 8rem);
    min-height: 50vh;
    width: 100%;
    background: var(--panel);
    border-radius: 6px;
    overflow: hidden;
    touch-action: pan-y;
  }
  .stage .bg, .stage img {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  .stage .bg {
    background-size: cover; background-position: center;
    filter: blur(28px) brightness(.6); transform: scale(1.15);
    transition: opacity .5s ease;
  }
  .stage img { object-fit: contain; transition: opacity .5s ease; }
  .stage.loading img, .stage.loading .bg { opacity: 0; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1rem; }
  .controls button {
    background: var(--ink); color: var(--bg); border: 0; border-radius: 50%;
    width: 2.5rem; height: 2.5rem; font-size: 1.2rem; cursor: pointer;
  }
  .counter { min-width: 5rem; text-align: center; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .stage img, .stage .bg { transition: none; } }
</style>
</head>
<body>
<header>
  <a class="contact" id="contact" href="#" title="Me contacter" aria-label="Me contacter par e-mail">
    <img src="kenny.png" alt="" width="32" height="35">
  </a>
</header>

<main>
  <section class="slideshow" aria-roledescription="carrousel" aria-label="Diaporama de photos">
    <div class="stage" id="stage">
      <div class="bg" id="bg"></div>
      <img id="photo" alt="" decoding="async">
    </div>
    <div class="controls">
      <button type="button" id="prev" aria-label="Photo précédente">&#8249;</button>
      <span class="counter" id="counter" aria-live="polite"></span>
      <button type="button" id="next" aria-label="Photo suivante">&#8250;</button>
    </div>
  </section>
</main>

<script>
  document.getElementById('contact').href = 'mailto:' + ['contact', 'arantxa.fr'].join('@');

  var total = 30;
  var photos = [];
  for (var i = 1; i <= total; i++) photos.push('photos/photo-' + (i < 10 ? '0' : '') + i + '.jpg');

  var stage = document.getElementById('stage');
  var img = document.getElementById('photo');
  var bg = document.getElementById('bg');
  var counter = document.getElementById('counter');
  var current = 0, timer = null;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function show(n) {
    current = (n + photos.length) % photos.length;
    var url = photos[current];
    stage.classList.add('loading');
    var loader = new Image();
    loader.onload = function () {
      if (photos[current] !== url) return;
      img.src = url;
      bg.style.backgroundImage = 'url(' + url + ')';
      stage.classList.remove('loading');
    };
    loader.src = url;
    counter.textContent = (current + 1) + ' / ' + photos.length;
    var next = new Image();
    next.src = photos[(current + 1) % photos.length];
  }
  function restart() {
    clearInterval(timer);
    if (!reduce) timer = setInterval(function () { show(current + 1); }, 4500);
  }
  function go(n) { show(n); restart(); }

  document.getElementById('prev').addEventListener('click', function () { go(current - 1); });
  document.getElementById('next').addEventListener('click', function () { go(current + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') go(current - 1);
    if (e.key === 'ArrowRight') go(current + 1);
  });
  var startX = null;
  stage.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40) go(current + (dx < 0 ? 1 : -1));
    startX = null;
  });
  stage.addEventListener('mouseenter', function () { clearInterval(timer); });
  stage.addEventListener('mouseleave', restart);

  show(0); restart();
</script>
</body>
</html>
