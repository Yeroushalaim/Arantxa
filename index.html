  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 16px 16px; }

  .slideshow { position: relative; width: min(1024px, 100%); aspect-ratio: 4 / 3; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 6px 30px rgba(0,0,0,.55), 0 0 0 1px rgba(232,72,24,.35); cursor: zoom-in; }

  lb.querySelector(".stage").onclick = function (e) { if (e.target === this) closeLb(); };
  document.addEventListener("keydown", function (e) {
    if (lb.className.indexOf("open") < 0) return;
    if (e.key === "Escape") closeLb();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
  });
</script>
</body>
</html>
